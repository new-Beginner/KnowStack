<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>KnowStack 0.6.0 Docked Tests</title><style>body{margin:0;overflow:hidden;background:#eef3f7;font:14px 'Segoe UI',sans-serif;color:#223448}main{padding:28px;max-width:55%;height:100vh;overflow:auto;box-sizing:border-box}iframe{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);height:100%;border:0;border-left:1px solid #ccd6e1}pre{white-space:pre-wrap}</style></head><body><main><h1>项目记忆 · 侧栏回归</h1><p>只用模拟数据，侧栏渲染正式插件页面组件。</p><pre id="results">加载中</pre></main><iframe id="dock" src="../renderer/memory-view.html" title="项目记忆侧栏"></iframe><script type="module">
import {bootMemoryView} from '../renderer/memory-view.mjs';
const frame=document.getElementById('dock');if(!frame.contentDocument?.querySelector('#memory-root'))await new Promise(r=>frame.onload=r);
const d=frame.contentDocument;
let active={sessionId:'a',projectPath:'D:/Projects/KnowStack'},writes=0,token=0,offline=false;
const config={autoSave:true,autoDelete:false};const stores={a:[{id:'repo',title:'项目仓库',content:'项目仓库为 https://example.org/knowstack；项目约束与设计决策在 docs/architecture.md。'},{id:'limit',title:'不可越过的限制',content:'插件不得修改宿主源码或直接访问数据库，只通过插件接口访问原生项目记忆。'},{id:'index',title:'会话索引',content:'会话 abc123 记录侧栏接口选型与保存并发边界，可在原生聊天列表按标题“记忆接口设计”检索。'}],b:[]};
const original=structuredClone(stores.a);
const started=performance.now(),trace=[];const first=new Set();
const bridge={on(){return()=>{};},async invoke(channel,args){
 const mark={channel,start:performance.now()-started};trace.push(mark);
 if(!first.has(channel)){first.add(channel);await new Promise(r=>setTimeout(r,{'app.getAppearance':300,'memory.context':40,'memory.mode':250,'memory.editor':60}[channel]||0));}mark.end=performance.now()-started;
 if(channel==='app.getAppearance')return{base:new URLSearchParams(location.search).get('theme')||'light',locale:'zh-CN'};
 if(offline)throw Error('offline');
 if(channel==='memory.context'){if(!active)throw Error('NO_PANEL_PROJECT');return{...active};}
 if(args.sessionId!==active.sessionId)throw Error('PANEL_CONTEXT_CHANGED');
 if(channel==='memory.mode'){if(args.action==='set')for(const key of ['autoSave','autoDelete'])if(key in args)config[key]=args[key];return{...config};}
 if(channel==='memory.editor'){
  if(args.action==='save'){stores[active.sessionId]=structuredClone(args.entries);writes++;return{status:'replaced'};}
  return{status:'read',readToken:'t'+token++,entries:structuredClone(stores[active.sessionId]),project:{key:'group:'+active.sessionId,name:active.sessionId==='a'?'知栈':'项目B',path:active.projectPath.toLowerCase(),paths:[active.projectPath.toLowerCase()]}};
 }throw Error('unknown');
}};
const view=await bootMemoryView(bridge,d);const mounted=performance.now()-started;const initialLoading=d.querySelector('.km-empty')?.textContent;const pause=()=>new Promise(r=>setTimeout(r,10));
const wait=async()=>{for(let i=0;i<300;i++){await pause();if(view.editor.getState().loaded&&!view.editor.getState().busy)return;}throw Error('load timeout');};
await wait();const loaded=performance.now()-started;const modeDisabledAtRead=[...d.querySelectorAll('[role=switch]')].every(n=>n.disabled);
for(let i=0;i<300&&!view.client.modes.getState().loaded;i++)await pause();
const startup={mounted,loaded,trace:trace.slice()};const layout={};
const check=(v,m)=>{if(!v)throw Error(m);};const q=s=>d.querySelector(s);const change=(s,v)=>{const n=q(s);n.value=v;n.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));};
window.runBrowserTests=async()=>{const passed=[];const run=async(name,fn)=>{await fn();passed.push(name);};try{
 await run('内嵌正式视图，不创建全屏弹层或窗口',async()=>{check(q('[role=region]')&&!q('[role=dialog]'),'not a region');const r=q('.knowstack-editor').getBoundingClientRect();check(r.width<=frame.clientWidth&&r.height<=frame.clientHeight,'view overflows');check(getComputedStyle(q('.knowstack-editor-backdrop')).position==='relative','fixed overlay');check(writes===0,'load wrote');});
 await run('只显示项目名称，不显示地址或自动跟随文案',async()=>{check(!q('select'),'redundant selector remains');check(q('.km-project').textContent==='知栈','project name is not displayed');check(!d.body.textContent.includes('自动跟随'),'follow copy remains');check(!q('.km-path').textContent.includes('d:/'),'path remains');});
 await run('删除指定小字，工具栏改图标但保留可访问名称',async()=>{check(!q('footer p'),'footer hint remains');check(q('.km-mode-hint')?.hidden!==false,'mode hint remains');for(const [selector,label] of [['.km-refresh','重新读取'],['.km-add','添加记忆']]){const button=q(selector);check(button.querySelector('svg')&&!button.textContent.trim(),'not icon-only');check(button.getAttribute('aria-label')===label&&button.title===label,'missing accessible name');}});
 await run('图标按钮仍可添加和重新读取，脏草稿需确认',async()=>{const count=view.editor.getState().entries.length;q('.km-add').click();check(view.editor.getState().entries.length===count+1&&view.editor.getState().dirty,'add icon failed');q('.km-refresh').click();check(q('[role=alertdialog]'),'refresh bypassed draft confirmation');q('.km-confirm-accept').click();await wait();check(view.editor.getState().entries.length===count&&!view.editor.getState().dirty&&writes===0,'refresh changed native memory');});
 await run('慢主题与慢开关不阻塞界面和正文',async()=>{const appearance=startup.trace.find(x=>x.channel==='app.getAppearance'),context=startup.trace.find(x=>x.channel==='memory.context'),mode=startup.trace.find(x=>x.channel==='memory.mode'),read=startup.trace.find(x=>x.channel==='memory.editor');check(mounted<appearance.end,'appearance gates mounting');check(context.start<appearance.end,'appearance gates context');check(read.start<mode.end&&loaded<mode.end,'mode gates memory');check(initialLoading.includes('正在读取')&&modeDisabledAtRead,'loading or disabled switch guard missing');});
 await run('空列表按内容收紧，状态和保存按钮均保留',async()=>{const before=stores.a;stores.a=[];await view.editor.load();await wait();const editor=q('.knowstack-editor'),footer=q('footer'),body=q('.km-body');layout.empty={height:editor.clientHeight,footer:footer.clientHeight,width:editor.clientWidth};check(editor.clientHeight<650,'empty editor stretched to viewport');check(footer.getBoundingClientRect().top-body.getBoundingClientRect().bottom<=1,'gap before footer');check(footer.clientHeight<145,'oversized footer');check(q('.km-empty').textContent.includes('还没有记忆')&&q('.km-save')&&q('.km-status'),'required controls lost');check(editor.scrollWidth<=frame.clientWidth,'empty layout overflow');stores.a=before;await view.editor.load();await wait();});
 await run('自动保存和删除开关即时持久化，修改没有开关',async()=>{check(d.querySelectorAll('[role=switch]').length===2,'wrong switches');q('[aria-label="允许模型删除记忆"]').click();await pause();check(config.autoDelete,'delete not persisted');check(config.autoSave,'other mode lost');check(writes===0,'toggle wrote memory');});
 await run('设置侧修改反向同步，正文光标节点不重建',async()=>{const field=q('textarea');field.focus();field.setSelectionRange(2,2);config.autoSave=false;config.autoDelete=false;await view.client.refresh();check(q('[aria-label="自动保存新记忆"]').getAttribute('aria-checked')==='false','save not synchronized');check(q('[aria-label="允许模型删除记忆"]').getAttribute('aria-checked')==='false','delete not synchronized');check(q('textarea')===field&&d.activeElement===field,'focus lost');});
 await run('原厂线框垃圾桶有标签，删除只进草稿',async()=>{const trash=q('.km-delete');check(trash.querySelector('svg')&&trash.getAttribute('aria-label'),'missing accessible trash');trash.click();check(q('[role=alertdialog]'),'missing confirmation');q('.km-confirm-cancel').click();check(view.editor.getState().entries.length===3&&writes===0,'cancel changed memory');});
 await run('修改保留原ID，手动保存后回读',async()=>{change('textarea','项目仓库改为 https://example.org/new；约束仍以 docs/architecture.md 为准。');q('.km-save').click();await wait();check(stores.a[0].id==='repo'&&writes===1,'update not saved');check(q('.km-status').textContent.includes('回读验证成功'),'no receipt');});
 await run('删除开关关闭不限制用户手动删除',async()=>{q('.km-delete').click();q('.km-confirm-accept').click();check(stores.a.length===3,'draft wrote');q('.km-save').click();await wait();check(stores.a.length===2&&writes===2,'manual delete refused');});
 await run('项目变化保留脏草稿并锁定旧项目保存',async()=>{change('textarea','未保存草稿');active={sessionId:'b',projectPath:'D:/Projects/B'};await view.client.refresh();check(view.editor.getState().dirty&&q('.km-save').disabled,'draft was redirected');q('.km-refresh').click();q('.km-confirm-accept').click();await wait();check(view.editor.getState().projectKey==='group:b'&&!view.editor.getState().entries.length,'did not follow B');active={sessionId:'a',projectPath:'D:/Projects/KnowStack'};await view.client.refresh();await wait();});
 await run('长列表仅侧栏内部滚动，窄栏没有横向溢出',async()=>{stores.a=Array.from({length:25},(_,i)=>({id:'long'+i,title:'长期项目知识 '+i,content:'保留完整结论与适用范围，资料位置 docs/reference.md。'.repeat(4)}));await view.editor.load();await wait();const body=q('.km-body');check(body.scrollHeight>body.clientHeight,'no internal scroll');check(q('.knowstack-editor').scrollWidth<=frame.clientWidth,'horizontal overflow');check(q('.knowstack-editor').getBoundingClientRect().bottom<=frame.clientHeight,'footer overflow');});
 await run('失去项目不回退其他项目，恢复后重新读取',async()=>{active=null;await view.client.refresh();await pause();check(!view.editor.getState().loaded&&!view.client.modes.getState().loaded,'stale current project');active={sessionId:'a',projectPath:'D:/Projects/KnowStack'};await view.client.refresh();await wait();});
 await run('删除静态小字后仍显示真实开关读取错误',async()=>{offline=true;await view.client.refresh();await pause();check(q('.km-mode-hint')&&!q('.km-mode-hint').hidden&&q('.km-mode-hint').textContent.includes('无法核对'),'mode error hidden');offline=false;await view.client.refresh();await wait();check(q('.km-mode-hint').hidden,'static hint returned');});
 await run('主题事件胜过晚到初值，停止后不再修改页面',async()=>{const probeFrame=document.createElement('iframe');probeFrame.hidden=true;document.body.append(probeFrame);const pd=probeFrame.contentDocument;pd.body.innerHTML='<main id="memory-root"></main>';let release,handler,unsubscribed=false;const slow=new Promise(r=>{release=r;});const probe=await bootMemoryView({on(event,fn){if(event==='appearance:changed')handler=fn;return()=>{if(event==='appearance:changed')unsubscribed=true;};},invoke(channel,args){return channel==='app.getAppearance'?slow:bridge.invoke(channel,args);}},pd);handler({base:'dark',locale:'en'});release({base:'light',locale:'zh-CN'});await pause();check(pd.documentElement.dataset.base==='dark'&&pd.documentElement.lang==='en','late initial theme overwrote event');probe.stop();handler({base:'light'});check(unsubscribed&&!pd.getElementById('memory-root').children.length&&pd.documentElement.dataset.base==='dark'&&!pd.head.querySelector('style'),'late response or cleanup leak');probeFrame.remove();});
 stores.a=structuredClone(original);await view.editor.load();await wait();
 const result={passed:passed.length,failed:0,tests:passed,startup,layout};document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;
}catch(error){const result={passed:passed.length,failed:1,error:error.message,tests:passed};document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;}};
window.previewEmpty=async()=>{stores.a=[];await view.editor.load();await wait();};
</script></body></html>
