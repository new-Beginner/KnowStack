<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowStack 项目记忆交互测试</title>
<style>body{margin:0;background:#eef5fa;color:#193a51;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{padding:30px}.sidebar-footer{position:fixed;bottom:15px;left:15px}.footer-actions{display:flex;gap:8px}#layers{position:fixed;inset:0;pointer-events:none}pre{white-space:pre-wrap}.work-panel-launcher{position:fixed;right:0;top:0;bottom:0;width:min(340px,100%);box-sizing:border-box;background:#ecf6ff;padding:14px 10px}.work-panel-launcher-list{display:flex;flex-direction:column;gap:2px}.work-panel-launcher-row{border:0;background:transparent;border-radius:6px;min-width:0;height:40px;color:inherit;font:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer}.work-panel-launcher-row:hover{background:#dfedf6}.work-panel-launcher-row:focus-visible{outline:2px solid #1689bf;outline-offset:-2px}.work-panel-launcher-icon{width:18px;color:#527089;flex:none;display:inline-flex;justify-content:center;align-items:center}.work-panel-launcher-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}</style></head>
<body><main><h1>KnowStack 0.4.3 记忆管理</h1><p>模拟项目，不访问真实宿主数据。入口位于右侧工作面板的新建列表。</p><button id="run">运行交互回归</button><pre id="results">待运行</pre></main><div class="sidebar-footer"><div class="footer-actions"><button id="left-host-action">左侧宿主按钮</button></div></div><aside class="work-panel-launcher"><p>新建</p><div class="work-panel-launcher-list"><button id="host-action" class="work-panel-launcher-row"><span class="work-panel-launcher-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 9h16"/></svg></span><span class="work-panel-launcher-label">浏览器</span></button></div></aside><div id="layers"></div>
<script type="module">
import {createMemoryAccess} from '../renderer/memory-editor.mjs';
import {installMemoryEntry,MEMORY_CSS} from '../renderer/memory-ui.mjs';
import {connectPanelContext} from '../renderer/panel-context.mjs';
const style=document.createElement('style');style.textContent=MEMORY_CSS;document.head.append(style);
const sample=[{id:'ga',name:'A · 知栈',roots:[{path:'D:/Projects/KnowStack'}]},{id:'gb',name:'B · 泥石流数值模拟',roots:[{path:'D:/Research/DebrisFlow'}]}];
const initial=[{id:'a',title:'会话项目归属查询',content:'根据发起会话核验项目归属；切换聊天时，旧请求不能写入其他项目。'},{id:'b',title:'原生记忆整表并发边界',content:'原生记忆写入提交完整条目列表；保存前比对快照，保存后回读确认。保存期间避免同时编辑记忆或重载插件。'}];
let groups=structuredClone(sample),stores={ga:structuredClone(initial),gb:[]},writes=0,revision=0,offline=false,lostResponse=false,prompts=[];
let panelState={activeSessionId:'sb',activeProjectPath:'D:/Research/DebrisFlow',sessions:[{id:'sa',projectPath:'D:/Projects/KnowStack'},{id:'sb',projectPath:'D:/Research/DebrisFlow'}]};
const activeContexts=new Set();
const identity=document.createElement('div');identity.className='sidebar';document.body.append(identity);
const showIdentity=(id,path=null)=>{identity.replaceChildren();if(id){const pane=document.createElement('div');pane.setAttribute('data-session-pane',id);pane.setAttribute('data-visible','true');identity.append(pane);}else if(path){const project=document.createElement('section');project.setAttribute('data-sidebar-project-group',path);project.setAttribute('data-current-workspace','true');identity.append(project);}};
const switchPanel=id=>{panelState={...panelState,activeSessionId:id,activeProjectPath:panelState.sessions.find(s=>s.id===id)?.projectPath??null};showIdentity(id);};
showIdentity('sb');
const connectContext=async(doc,options)=>{const context=await connectPanelContext(doc,options);activeContexts.add(context);return{...context,stop(){context.stop();activeContexts.delete(context);}};};
window.confirm=message=>{prompts.push(message);return true;};
const keys=['sessionGet','projectGroupList','projectGroupMemoryGet','projectGroupMemorySave','projectMemoryGet','projectMemorySave'];
const bridge={channels:{invoke:Object.fromEntries(keys.map(k=>[k,k]))},async invoke(key,input){
 await new Promise(resolve=>setTimeout(resolve,5));if(offline)throw Error('offline');
 if(key==='projectGroupList')return{ok:true,data:{groups:structuredClone(groups)}};
 if(key==='sessionGet')return{ok:true,data:{session:structuredClone(panelState.sessions.find(s=>s.id===input.id))}};
 const id=input.groupId??'ga';
 if(key.endsWith('Save')){stores[id]=structuredClone(input.entries);writes++;revision++;if(lostResponse)throw Error('lost response');}
 const entries=structuredClone(stores[id]);return{ok:true,data:{memory:{entries,content:entries.map(e=>e.title+'\n'+e.content).join('\n\n'),updatedAt:revision}}};
}};
const access=createMemoryAccess(bridge);
const pi={ui:{openLayer(){const element=document.createElement('div');element.setAttribute('data-pi-layer','');element.style.cssText='position:fixed;top:0;left:0;width:0;height:0;z-index:600';document.getElementById('layers').append(element);return{element,close:()=>element.remove()};}}};
let uninstall=installMemoryEntry(pi,access,document,{connectContext});
const check=(yes,message)=>{if(!yes)throw Error(message);};
const pause=()=>new Promise(resolve=>setTimeout(resolve,5));
const wait=async()=>{for(let i=0;i<400;i++){await pause();if(document.querySelector('.km-refresh')&&!document.querySelector('.km-refresh').disabled&&!document.querySelector('.km-error')?.textContent.includes('正在切换'))return;}throw Error('timeout');};
const open=async()=>{document.querySelector('.knowstack-memory-entry').focus();document.querySelector('.knowstack-memory-entry').click();await wait();};
const close=()=>document.querySelector('.km-cancel')?.click();
const respond=accepted=>{const node=document.querySelector(accepted?'.km-confirm-accept':'.km-confirm-cancel');check(node,'missing inline confirmation');node.click();};
const reread=()=>{document.querySelector('.km-refresh').click();if(document.querySelector('[role=alertdialog]'))respond(true);};
const input=(node,value)=>{node.value=value;node.dispatchEvent(new Event('input',{bubbles:true}));};
window.testApp={open,wait,access,stores,get writes(){return writes;},get nativeConfirmCalls(){return prompts.length;}};
window.runBrowserTests=async()=>{
 const passed=[];const run=async(name,fn)=>{await fn();passed.push(name);};
 try{
  await run('入口只在右侧新建列表，图标和行尺寸与宿主一致',async()=>{const entry=document.querySelector('.knowstack-memory-entry');const host=document.getElementById('host-action');check(entry?.parentElement.classList.contains('work-panel-launcher-list'),'not in right launcher');check(!document.querySelector('.sidebar-footer .knowstack-memory-entry'),'left entry remains');check(entry.textContent==='项目记忆','missing text label');const a=entry.getBoundingClientRect(),b=host.getBoundingClientRect(),icon=entry.querySelector('svg').getBoundingClientRect();check(a.height===b.height&&a.width===b.width,'row size differs');check(icon.width===15&&icon.height===15,'icon size differs');check(entry.querySelector('svg').getAttribute('stroke-width')==='2','stroke differs');});
  await run('从非首个项目打开时自动跟随，再随当前面板切回首项目',async()=>{await open();document.querySelector('.knowstack-memory-entry').click();check(document.querySelectorAll('[role=dialog]').length===1,'duplicate dialog');check(document.querySelector('select').value==='group:gb','defaulted to first project');check(document.querySelector('select').disabled,'project manually selectable');check(document.querySelectorAll('.km-item').length===0,'wrong project loaded');switchPanel('sa');await wait();check(document.querySelectorAll('.km-item').length===2,'did not auto follow');check(writes===0,'loading wrote');check(document.querySelectorAll('.knowstack-memory-entry').length===1,'duplicate entry');});
  await run('零尺寸宿主弹层覆盖视口且输入框可命中',async()=>{const box=document.querySelector('[data-pi-layer]').getBoundingClientRect();check(box.width===0&&box.height===0,'wrong host fixture');const rect=document.querySelector('.knowstack-editor-backdrop').getBoundingClientRect();check(rect.width>=innerWidth&&rect.height>=innerHeight,'backdrop not full');const field=document.querySelector('textarea');const r=field.getBoundingClientRect();check(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===field,'input not reachable');});
  await run('删除确认只使用页内弹层，不调用系统模态对话框',async()=>{const before=prompts.length;document.querySelector('.km-delete').click();check(prompts.length===before,'native confirm called');check(document.querySelector('[role=alertdialog]'),'missing inline confirmation');check(document.querySelectorAll('.km-item').length===2,'deleted before confirmation');document.querySelector('.km-confirm-cancel').click();check(document.querySelectorAll('.km-item').length===2,'cancelled deletion applied');});
  await run('确认框键盘循环、Esc 只取消确认并恢复原按钮焦点',async()=>{const trigger=document.querySelector('.km-delete');trigger.focus();trigger.click();const modal=document.querySelector('[role=alertdialog]');check(document.activeElement.classList.contains('km-confirm-cancel'),'unsafe default focus');check(document.querySelector('.knowstack-editor').inert,'editor not inert');modal.dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',shiftKey:true,bubbles:true,cancelable:true}));check(document.activeElement.classList.contains('km-confirm-accept'),'focus escaped confirmation');modal.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check(!document.querySelector('[role=alertdialog]'),'escape did not cancel');check(document.querySelector('[role=dialog]')&&!document.querySelector('.knowstack-editor').inert,'editor remained inert');check(document.activeElement===trigger,'focus not restored');});
  await run('确认框等待期间项目切换不会删除新项目同 ID 条目',async()=>{stores.gb=[{id:'a',title:'B 项目规则',content:'不能被 A 项目删除确认影响'}];document.querySelector('.km-delete').click();switchPanel('sb');await wait();respond(true);check(document.querySelectorAll('.km-item').length===1,'stale delete applied to new project');check(document.querySelector('textarea').value===stores.gb[0].content,'new project changed');switchPanel('sa');await wait();stores.gb=[];});
  await run('编辑不丢失节点、焦点和光标，未保存不写入',async()=>{const field=document.querySelector('textarea');field.focus();input(field,'修改中的内容');field.setSelectionRange(2,2);input(field,'修改中的内容二');check(document.querySelector('textarea')===field,'field replaced');check(document.activeElement===field,'focus lost');check(!document.querySelector('.km-save').disabled,'save unavailable');check(writes===0,'draft wrote');});
  await run('取消关闭须确认，拒绝时草稿保留，确认后不保存',async()=>{close();respond(false);check(document.querySelector('[role=dialog]'),'closed despite rejection');close();respond(true);check(!document.querySelector('[role=dialog]'),'not closed');check(document.activeElement.classList.contains('knowstack-memory-entry'),'focus not restored');check(writes===0,'cancel wrote');await open();check(document.querySelector('textarea').value===initial[0].content,'draft leaked');});
  await run('新增自动聚焦、空正文禁用保存、填写后回读成功',async()=>{document.querySelector('.km-add').click();const row=document.querySelector('.km-list').lastElementChild;check(document.activeElement===row.querySelector('input'),'new title not focused');check(document.querySelector('.km-save').disabled,'empty body accepted');input(row.querySelector('input'),'新增规则');input(row.querySelector('textarea'),'新增记忆内容');document.querySelector('.km-save').click();await wait();check(writes===1&&stores.ga.length===3,'not saved');check(document.querySelector('.km-status').textContent.includes('回读验证成功'),'missing receipt');});
  await run('删除可拒绝，确认后先改草稿，保存后生效',async()=>{document.querySelector('.km-delete').click();respond(false);check(document.querySelectorAll('.km-item').length===3,'deleted on rejection');document.querySelector('.km-delete').click();respond(true);check(document.querySelectorAll('.km-item').length===2&&stores.ga.length===3,'delete not staged');document.querySelector('.km-save').click();await wait();check(stores.ga.length===2&&writes===2,'deletion not saved');});
  await run('项目变化保留旧草稿并锁定保存，确认重新读取才切换',async()=>{input(document.querySelector('textarea'),'临时草稿');const select=document.querySelector('select');switchPanel('sb');await wait();check(select.value==='group:ga','dirty draft redirected');check(document.querySelector('textarea').value==='临时草稿','draft lost');check(document.querySelector('.km-save').disabled,'wrong-project save enabled');document.querySelector('.km-refresh').click();respond(false);check(select.value==='group:ga','discard rejection ignored');reread();await wait();check(select.value==='group:gb','not following current project');check(document.querySelectorAll('.km-item').length===0,'other project mixed');check(document.querySelector('.km-empty').textContent.includes('还没有记忆'),'empty message');switchPanel('sa');await wait();check(document.querySelector('textarea').value!=='临时草稿','draft crossed projects');});
  await run('外部变更阻止覆盖并保留草稿',async()=>{input(document.querySelector('textarea'),'我的冲突草稿');stores.ga.push({id:'external',title:'其他窗口',content:'不能覆盖'});document.querySelector('.km-save').click();await wait();check(writes===2,'stale overwrite');check(document.querySelector('.km-error').textContent.includes('其他窗口'),'no conflict');check(document.querySelector('textarea').value==='我的冲突草稿','draft lost');check(document.querySelector('.km-save').disabled,'retry enabled');reread();await wait();});
  await run('保存响应丢失不误报成功、不允许重复提交',async()=>{input(document.querySelector('textarea'),'响应丢失用例');lostResponse=true;document.querySelector('.km-save').click();await wait();lostResponse=false;check(writes===3,'wrong write count');check(document.querySelector('.km-error').textContent.includes('结果待确认'),'missing uncertain result');check(!document.querySelector('.km-status').textContent.includes('成功'),'false success');check(document.querySelector('.km-save').disabled,'retry available');reread();await wait();});
  await run('失败读取保留列表，标题正文作为文本处理',async()=>{offline=true;reread();await wait();check(document.querySelectorAll('.km-item').length===3,'failure cleared cards');check(!document.querySelector('.km-error').hidden,'error hidden');offline=false;stores.ga[0].title='<img src=x onerror=alert(1)>';stores.ga[0].content='<script>bad()<\/script>';reread();await wait();check(!document.querySelector('.km-list img,.km-list script'),'HTML executed');});
  await run('键盘循环与 Escape 关闭后恢复入口焦点',async()=>{document.querySelector('.km-cancel').focus();document.querySelector('.km-cancel').dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));check(document.activeElement.className==='km-close','tab escaped');document.querySelector('[role=dialog]').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check(!document.querySelector('[role=dialog]'),'escape failed');check(document.activeElement.classList.contains('knowstack-memory-entry'),'entry focus lost');});
  await run('宿主重绘右侧列表后入口重挂载且不破坏宿主按钮',async()=>{const list=document.querySelector('.work-panel-launcher-list');const replacement=document.createElement('div');replacement.className='work-panel-launcher-list';replacement.append(document.getElementById('host-action'));list.replaceWith(replacement);await pause();check(document.querySelectorAll('.knowstack-memory-entry').length===1,'entry not remounted');check(document.getElementById('host-action')&&document.getElementById('left-host-action'),'host button removed');});
  await run('无聊天项目使用当前项目标记，且能恢复到活动会话',async()=>{await open();showIdentity(null,'D:/Research/DebrisFlow');await wait();check(document.querySelector('select').value==='group:gb','no-chat project not followed');switchPanel('sa');await wait();check(document.querySelector('select').value==='group:ga','session not restored');close();});
  await run('当前面板无项目时不回退首项目，恢复项目后自动读取',async()=>{await open();switchPanel(null);await wait();check(document.querySelector('select').value==='','fallback project selected');check(document.querySelectorAll('.km-item').length===0,'old project shown as current');check(document.querySelector('.km-error').textContent.includes('没有本地项目'),'no context warning');switchPanel('sa');await wait();check(document.querySelector('select').value==='group:ga','did not recover');close();});
  await run('长列表和窄屏不溢出、正文区可滚动',async()=>{stores.ga=Array.from({length:45},(_,i)=>({id:'long'+i,title:'长记忆标题用于窄屏检查'+i,content:'保留完整正文并允许滚动查看。'.repeat(8)}));await open();const rect=document.querySelector('[role=dialog]').getBoundingClientRect();const body=document.querySelector('.km-body');check(rect.left>=0&&rect.right<=innerWidth&&rect.top>=0&&rect.bottom<=innerHeight,'dialog overflow');check(body.scrollHeight>body.clientHeight,'not scrollable');check(document.querySelector('[role=dialog]').scrollWidth<=document.querySelector('[role=dialog]').clientWidth,'horizontal overflow');close();stores.ga=structuredClone(initial);});
  await run('卸载移除自己的入口、确认框和项目订阅，保留宿主节点',async()=>{await open();document.querySelector('.km-delete').click();check(document.querySelector('[role=alertdialog]'),'missing pending confirmation');uninstall();check(!document.querySelector('.knowstack-memory-entry,[role=dialog],[role=alertdialog]'),'unload residue');check(activeContexts.size===0,'context subscription leaked');check(document.getElementById('host-action'),'host removed');uninstall=installMemoryEntry(pi,access,document,{connectContext});await open();});
  await run('无法识别宿主面板时明确报错，不读取任意项目',async()=>{close();uninstall();uninstall=installMemoryEntry(pi,access,document,{connectContext:async()=>{throw Error('incompatible host');}});await open();check(document.querySelectorAll('.km-item').length===0,'fallback memory read');check(document.querySelector('.km-error').textContent.includes('无法识别'),'missing compatibility error');close();uninstall();uninstall=installMemoryEntry(pi,access,document,{connectContext});await open();});
  check(prompts.length===0,'native dialog called during memory interaction');
  const result={passed:passed.length,failed:0,tests:passed};document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;
 }catch(error){const result={passed:passed.length,failed:1,error:error.message,tests:passed};document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;}
};
document.getElementById('run').onclick=()=>window.runBrowserTests();
if(new URLSearchParams(location.search).has('autorun'))void window.runBrowserTests();
</script><textarea id="chat-input" aria-label="聊天消息" style="position:fixed;left:12px;bottom:12px;z-index:10;width:calc(100% - 24px);max-width:500px;height:40px;box-sizing:border-box" placeholder="模拟宿主聊天消息输入框"></textarea></body></html>
