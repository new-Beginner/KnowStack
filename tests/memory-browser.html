<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowStack 项目记忆交互测试</title>
<style>body{margin:0;background:#eef5fa;color:#193a51;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{padding:30px}.sidebar-footer{position:fixed;bottom:15px;left:15px}.footer-actions{display:flex;gap:8px}#layers{position:fixed;inset:0;pointer-events:none}pre{white-space:pre-wrap}.work-panel-launcher{position:fixed;right:0;top:0;bottom:0;width:min(340px,100%);box-sizing:border-box;background:#ecf6ff;padding:14px 10px}.work-panel-launcher-list{display:flex;flex-direction:column;gap:2px}.work-panel-launcher-row{border:0;background:transparent;border-radius:6px;min-width:0;height:40px;color:inherit;font:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer}.work-panel-launcher-row:hover{background:#dfedf6}.work-panel-launcher-row:focus-visible{outline:2px solid #1689bf;outline-offset:-2px}.work-panel-launcher-icon{width:18px;color:#527089;flex:none;display:inline-flex;justify-content:center;align-items:center}.work-panel-launcher-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}</style></head>
<body><main><h1>KnowStack 0.4.1 记忆管理</h1><p>模拟项目，不访问真实宿主数据。入口位于右侧工作面板的新建列表。</p><button id="run">运行交互回归</button><pre id="results">待运行</pre></main><div class="sidebar-footer"><div class="footer-actions"><button id="left-host-action">左侧宿主按钮</button></div></div><aside class="work-panel-launcher"><p>新建</p><div class="work-panel-launcher-list"><button id="host-action" class="work-panel-launcher-row"><span class="work-panel-launcher-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM4 9h16"/></svg></span><span class="work-panel-launcher-label">浏览器</span></button></div></aside><div id="layers"></div>
<script type="module">
import {createMemoryAccess} from '../renderer/memory-editor.mjs';
import {installMemoryEntry,MEMORY_CSS} from '../renderer/memory-ui.mjs';
const style=document.createElement('style');style.textContent=MEMORY_CSS;document.head.append(style);
const sample=[{id:'ga',name:'A · 知栈',roots:[{path:'D:/Projects/KnowStack'}]},{id:'gb',name:'B · 泥石流数值模拟',roots:[{path:'D:/Research/DebrisFlow'}]}];
const initial=[{id:'a',title:'会话项目归属查询',content:'根据发起会话核验项目归属；切换聊天时，旧请求不能写入其他项目。'},{id:'b',title:'原生记忆整表并发边界',content:'原生记忆写入提交完整条目列表；保存前比对快照，保存后回读确认。保存期间避免同时编辑记忆或重载插件。'}];
let groups=structuredClone(sample),stores={ga:structuredClone(initial),gb:[]},writes=0,revision=0,offline=false,lostResponse=false,answer=true,prompts=[];
window.confirm=message=>{prompts.push(message);return answer;};
const keys=['projectGroupList','projectGroupMemoryGet','projectGroupMemorySave','projectMemoryGet','projectMemorySave'];
const bridge={channels:{invoke:Object.fromEntries(keys.map(k=>[k,k]))},async invoke(key,input){
 await new Promise(resolve=>setTimeout(resolve,5));if(offline)throw Error('offline');
 if(key==='projectGroupList')return{ok:true,data:{groups:structuredClone(groups)}};
 const id=input.groupId??'ga';
 if(key.endsWith('Save')){stores[id]=structuredClone(input.entries);writes++;revision++;if(lostResponse)throw Error('lost response');}
 const entries=structuredClone(stores[id]);return{ok:true,data:{memory:{entries,content:entries.map(e=>e.title+'\n'+e.content).join('\n\n'),updatedAt:revision}}};
}};
const access=createMemoryAccess(bridge);
const pi={ui:{openLayer(){const element=document.createElement('div');element.setAttribute('data-pi-layer','');element.style.cssText='position:fixed;top:0;left:0;width:0;height:0;z-index:600';document.getElementById('layers').append(element);return{element,close:()=>element.remove()};}}};
let uninstall=installMemoryEntry(pi,access);
const check=(yes,message)=>{if(!yes)throw Error(message);};
const pause=()=>new Promise(resolve=>setTimeout(resolve,5));
const wait=async()=>{for(let i=0;i<400;i++){await pause();if(document.querySelector('.km-refresh')&&!document.querySelector('.km-refresh').disabled)return;}throw Error('timeout');};
const open=async()=>{document.querySelector('.knowstack-memory-entry').focus();document.querySelector('.knowstack-memory-entry').click();await wait();};
const close=()=>document.querySelector('.km-cancel')?.click();
const input=(node,value)=>{node.value=value;node.dispatchEvent(new Event('input',{bubbles:true}));};
window.testApp={open,access,stores,get writes(){return writes;}};
window.runBrowserTests=async()=>{
 const passed=[];const run=async(name,fn)=>{await fn();passed.push(name);};
 try{
  await run('入口只在右侧新建列表，图标和行尺寸与宿主一致',async()=>{const entry=document.querySelector('.knowstack-memory-entry');const host=document.getElementById('host-action');check(entry?.parentElement.classList.contains('work-panel-launcher-list'),'not in right launcher');check(!document.querySelector('.sidebar-footer .knowstack-memory-entry'),'left entry remains');check(entry.textContent==='项目记忆','missing text label');const a=entry.getBoundingClientRect(),b=host.getBoundingClientRect(),icon=entry.querySelector('svg').getBoundingClientRect();check(a.height===b.height&&a.width===b.width,'row size differs');check(icon.width===15&&icon.height===15,'icon size differs');check(entry.querySelector('svg').getAttribute('stroke-width')==='2','stroke differs');});
  await run('侧边栏入口唯一、弹窗只读取、不重复打开',async()=>{await open();document.querySelector('.knowstack-memory-entry').click();check(document.querySelectorAll('[role=dialog]').length===1,'duplicate dialog');check(document.querySelectorAll('.km-item').length===2,'not loaded');check(writes===0,'loading wrote');check(document.querySelectorAll('.knowstack-memory-entry').length===1,'duplicate entry');});
  await run('零尺寸宿主弹层覆盖视口且输入框可命中',async()=>{const box=document.querySelector('[data-pi-layer]').getBoundingClientRect();check(box.width===0&&box.height===0,'wrong host fixture');const rect=document.querySelector('.knowstack-editor-backdrop').getBoundingClientRect();check(rect.width>=innerWidth&&rect.height>=innerHeight,'backdrop not full');const field=document.querySelector('textarea');const r=field.getBoundingClientRect();check(document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===field,'input not reachable');});
  await run('编辑不丢失节点、焦点和光标，未保存不写入',async()=>{const field=document.querySelector('textarea');field.focus();input(field,'修改中的内容');field.setSelectionRange(2,2);input(field,'修改中的内容二');check(document.querySelector('textarea')===field,'field replaced');check(document.activeElement===field,'focus lost');check(!document.querySelector('.km-save').disabled,'save unavailable');check(writes===0,'draft wrote');});
  await run('取消关闭须确认，拒绝时草稿保留，确认后不保存',async()=>{answer=false;close();check(document.querySelector('[role=dialog]'),'closed despite rejection');answer=true;close();check(!document.querySelector('[role=dialog]'),'not closed');check(document.activeElement.classList.contains('knowstack-memory-entry'),'focus not restored');check(writes===0,'cancel wrote');await open();check(document.querySelector('textarea').value===initial[0].content,'draft leaked');});
  await run('新增自动聚焦、空正文禁用保存、填写后回读成功',async()=>{document.querySelector('.km-add').click();const row=document.querySelector('.km-list').lastElementChild;check(document.activeElement===row.querySelector('input'),'new title not focused');check(document.querySelector('.km-save').disabled,'empty body accepted');input(row.querySelector('input'),'新增规则');input(row.querySelector('textarea'),'新增记忆内容');document.querySelector('.km-save').click();await wait();check(writes===1&&stores.ga.length===3,'not saved');check(document.querySelector('.km-status').textContent.includes('回读验证成功'),'missing receipt');});
  await run('删除可拒绝，确认后先改草稿，保存后生效',async()=>{answer=false;document.querySelector('.km-delete').click();check(document.querySelectorAll('.km-item').length===3,'deleted on rejection');answer=true;document.querySelector('.km-delete').click();check(document.querySelectorAll('.km-item').length===2&&stores.ga.length===3,'delete not staged');document.querySelector('.km-save').click();await wait();check(stores.ga.length===2&&writes===2,'deletion not saved');});
  await run('项目切换隔离、未保存切换可拒绝',async()=>{input(document.querySelector('textarea'),'临时草稿');const select=document.querySelector('select');answer=false;select.value='group:gb';select.dispatchEvent(new Event('change'));check(select.value==='group:ga','selection not restored');answer=true;select.value='group:gb';select.dispatchEvent(new Event('change'));await wait();check(document.querySelectorAll('.km-item').length===0,'other project mixed');check(document.querySelector('.km-empty').textContent.includes('还没有记忆'),'empty message');select.value='group:ga';select.dispatchEvent(new Event('change'));await wait();check(document.querySelector('textarea').value!=='临时草稿','draft crossed projects');});
  await run('外部变更阻止覆盖并保留草稿',async()=>{input(document.querySelector('textarea'),'我的冲突草稿');stores.ga.push({id:'external',title:'其他窗口',content:'不能覆盖'});document.querySelector('.km-save').click();await wait();check(writes===2,'stale overwrite');check(document.querySelector('.km-error').textContent.includes('其他窗口'),'no conflict');check(document.querySelector('textarea').value==='我的冲突草稿','draft lost');check(document.querySelector('.km-save').disabled,'retry enabled');document.querySelector('.km-refresh').click();await wait();});
  await run('保存响应丢失不误报成功、不允许重复提交',async()=>{input(document.querySelector('textarea'),'响应丢失用例');lostResponse=true;document.querySelector('.km-save').click();await wait();lostResponse=false;check(writes===3,'wrong write count');check(document.querySelector('.km-error').textContent.includes('结果待确认'),'missing uncertain result');check(!document.querySelector('.km-status').textContent.includes('成功'),'false success');check(document.querySelector('.km-save').disabled,'retry available');document.querySelector('.km-refresh').click();await wait();});
  await run('失败读取保留列表，标题正文作为文本处理',async()=>{offline=true;document.querySelector('.km-refresh').click();await wait();check(document.querySelectorAll('.km-item').length===3,'failure cleared cards');check(!document.querySelector('.km-error').hidden,'error hidden');offline=false;stores.ga[0].title='<img src=x onerror=alert(1)>';stores.ga[0].content='<script>bad()<\/script>';document.querySelector('.km-refresh').click();await wait();check(!document.querySelector('.km-list img,.km-list script'),'HTML executed');});
  await run('键盘循环与 Escape 关闭后恢复入口焦点',async()=>{document.querySelector('.km-cancel').focus();document.querySelector('.km-cancel').dispatchEvent(new KeyboardEvent('keydown',{key:'Tab',bubbles:true,cancelable:true}));check(document.activeElement.className==='km-close','tab escaped');document.querySelector('[role=dialog]').dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));check(!document.querySelector('[role=dialog]'),'escape failed');check(document.activeElement.classList.contains('knowstack-memory-entry'),'entry focus lost');});
  await run('宿主重绘右侧列表后入口重挂载且不破坏宿主按钮',async()=>{const list=document.querySelector('.work-panel-launcher-list');const replacement=document.createElement('div');replacement.className='work-panel-launcher-list';replacement.append(document.getElementById('host-action'));list.replaceWith(replacement);await pause();check(document.querySelectorAll('.knowstack-memory-entry').length===1,'entry not remounted');check(document.getElementById('host-action')&&document.getElementById('left-host-action'),'host button removed');});
  await run('长列表和窄屏不溢出、正文区可滚动',async()=>{stores.ga=Array.from({length:45},(_,i)=>({id:'long'+i,title:'长记忆标题用于窄屏检查'+i,content:'保留完整正文并允许滚动查看。'.repeat(8)}));await open();const rect=document.querySelector('[role=dialog]').getBoundingClientRect();const body=document.querySelector('.km-body');check(rect.left>=0&&rect.right<=innerWidth&&rect.top>=0&&rect.bottom<=innerHeight,'dialog overflow');check(body.scrollHeight>body.clientHeight,'not scrollable');check(document.querySelector('[role=dialog]').scrollWidth<=document.querySelector('[role=dialog]').clientWidth,'horizontal overflow');close();stores.ga=structuredClone(initial);});
  await run('卸载移除自己的入口和弹层，保留宿主节点',async()=>{await open();uninstall();check(!document.querySelector('.knowstack-memory-entry,[role=dialog]'),'unload residue');check(document.getElementById('host-action'),'host removed');uninstall=installMemoryEntry(pi,access);await open();});
  const result={passed:passed.length,failed:0,tests:passed};document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;
 }catch(error){const result={passed:passed.length,failed:1,error:error.message,tests:passed};document.getElementById('results').textContent=JSON.stringify(result,null,2);return result;}
};
document.getElementById('run').onclick=()=>window.runBrowserTests();
if(new URLSearchParams(location.search).has('autorun'))void window.runBrowserTests();
</script></body></html>
